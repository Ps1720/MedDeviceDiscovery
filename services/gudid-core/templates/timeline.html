<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeriopUDI — Patient Device Chart</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-6 py-6">

        <!-- Patient header bar -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-4">
            <div class="flex items-start justify-between gap-4 flex-wrap">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white flex items-center justify-center shadow-inner shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-9 h-9">
                            <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.69-8 6v2h16v-2c0-3.31-3.58-6-8-6Z"/>
                        </svg>
                    </div>
                    <div>
                        <p class="text-xs uppercase tracking-wide text-slate-400 font-semibold">Perioperative Device Chart</p>
                        <h1 id="patient-name" class="text-2xl font-bold text-slate-800 mt-1">Loading…</h1>
                        <div id="patient-meta" class="flex flex-wrap gap-2 mt-2"></div>
                    </div>
                </div>
                <div class="text-right">
                    <a href="/scan-to-chart" class="inline-flex items-center gap-1 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium">
                        + Document device
                    </a>
                    <p id="device-count" class="text-xs text-slate-400 mt-2"></p>
                </div>
            </div>
        </div>

        <!-- Recall alert banner -->
        <div id="recall-banner" class="hidden mb-4"></div>

        <!-- Device grid -->
        <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
            <p class="text-slate-400">Loading devices…</p>
        </div>
    </div>

    <script>
        const patientId = {{ patient_id | tojson }};
        const grid = document.getElementById('grid');
        const bannerEl = document.getElementById('recall-banner');

        const badge = (t, c) => `<span class="text-xs px-2 py-0.5 rounded-full font-medium ${c}">${t}</span>`;
        const chip  = (label, val) => `<span class="text-sm bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg">
            <span class="text-slate-400">${label}</span> ${val}</span>`;

        function renderPatient(p) {
            document.getElementById('patient-name').textContent = p.name || ('Patient ' + p.id);
            const meta = document.getElementById('patient-meta');
            const bits = [];
            bits.push(chip('ID', p.id));
            if (p.mrn) bits.push(chip('MRN', p.mrn));
            if (p.gender) bits.push(chip('Sex', p.gender));
            if (p.age != null) bits.push(chip('Age', p.age));
            if (p.birth_date) bits.push(chip('DOB', p.birth_date));
            meta.innerHTML = bits.join('');
        }

        function renderBanner(recalls) {
            if (!recalls || !recalls.length) { bannerEl.classList.add('hidden'); return; }
            const critical = recalls.some(c => c.indicator === 'critical');
            bannerEl.className = 'mb-4 rounded-2xl p-4 border ' +
                (critical ? 'bg-red-100 border-red-300' : 'bg-amber-100 border-amber-300');
            bannerEl.innerHTML = `
                <div class="flex items-start gap-3">
                    <span class="text-2xl">${critical ? '⛔' : '⚠️'}</span>
                    <div>
                        <h2 class="font-bold ${critical ? 'text-red-800' : 'text-amber-800'}">
                            ${recalls.length} device recall alert${recalls.length > 1 ? 's' : ''} for this patient</h2>
                        <ul class="text-sm mt-1 list-disc ml-5 ${critical ? 'text-red-700' : 'text-amber-800'}">
                            ${recalls.map(c => `<li>${c.summary}</li>`).join('')}
                        </ul>
                    </div>
                </div>`;
            bannerEl.classList.remove('hidden');
        }

        const CATEGORY = {
            cardiac:    { bar: 'bg-rose-500',   pill: 'bg-rose-100 text-rose-700',     label: 'Cardiac' },
            neuro:      { bar: 'bg-violet-500', pill: 'bg-violet-100 text-violet-700', label: 'Neuro' },
            ortho:      { bar: 'bg-amber-500',  pill: 'bg-amber-100 text-amber-700',   label: 'Orthopedic' },
            vascular:   { bar: 'bg-teal-500',   pill: 'bg-teal-100 text-teal-700',     label: 'Vascular' },
            ophthalmic: { bar: 'bg-cyan-500',   pill: 'bg-cyan-100 text-cyan-700',     label: 'Ophthalmic' },
            general:    { bar: 'bg-slate-400',  pill: 'bg-slate-100 text-slate-600',   label: 'General' },
        };
        const SAFETY_STYLE = {
            'mri':        'bg-indigo-100 text-indigo-700',
            'latex':      'bg-red-100 text-red-700',
            'no-latex':   'bg-emerald-100 text-emerald-700',
            'single-use': 'bg-slate-100 text-slate-600',
            'sterile':    'bg-sky-100 text-sky-700',
        };

        function deviceCard(d) {
            const cat = CATEGORY[d.category] || CATEGORY.general;
            const recalled = d.recall_flag;
            const critical = recalled && d.recall && d.recall.indicator === 'critical';
            const cardBorder = recalled ? (critical ? 'border-red-300 ring-2 ring-red-200'
                                                     : 'border-amber-300 ring-2 ring-amber-200')
                                        : 'border-slate-200';
            const recallBadge = recalled
                ? badge(`RECALL · ${(d.recall && d.recall.classification) || ''}`,
                        critical ? 'bg-red-600 text-white' : 'bg-amber-500 text-white') : '';
            const recallDetail = recalled && d.recall ? `
                <div class="mt-3 text-sm rounded-lg p-2.5 ${critical ? 'bg-red-50 text-red-800' : 'bg-amber-50 text-amber-800'}">
                    <span class="font-semibold">FDA recall ${d.recall.recall_number || ''}:</span> ${d.recall.reason || ''}
                </div>` : '';
            const gmdn = d.type ? `${d.type}${d.gmdn_code ? ` <span class="text-slate-400">(GMDN ${d.gmdn_code})</span>` : ''}` : '—';
            const safetyChips = (d.safety || [])
                .filter(s => s.display)
                .map(s => badge(s.display, SAFETY_STYLE[s.code] || 'bg-slate-100 text-slate-600'))
                .join(' ');
            return `
            <div class="bg-white rounded-2xl shadow-sm border ${cardBorder} overflow-hidden flex flex-col">
                <div class="h-1.5 ${cat.bar}"></div>
                <div class="p-4 flex flex-col h-full">
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="font-semibold text-slate-800 leading-snug">${d.name}</h3>
                        ${d.us_core ? badge('US Core', 'bg-blue-100 text-blue-700') : badge('EHR', 'bg-slate-100 text-slate-500')}
                    </div>
                    <div class="flex flex-wrap gap-1 mt-2">
                        ${badge(cat.label, cat.pill)}
                        ${recallBadge}
                        ${badge(d.status || 'unknown', 'bg-slate-100 text-slate-600')}
                    </div>
                    <p class="text-sm text-slate-500 mt-3">${gmdn}</p>
                    <dl class="text-sm text-slate-600 mt-2 space-y-1">
                        <div class="flex justify-between gap-2"><dt class="text-slate-400">Manufacturer</dt><dd class="text-right">${d.manufacturer || '—'}</dd></div>
                        <div class="flex justify-between gap-2"><dt class="text-slate-400">Model</dt><dd class="text-right">${d.model || '—'}</dd></div>
                        <div class="flex justify-between gap-2"><dt class="text-slate-400">UDI-DI</dt><dd class="text-right font-mono text-xs">${d.device_identifier || '—'}</dd></div>
                        <div class="flex justify-between gap-2"><dt class="text-slate-400">Expires</dt><dd class="text-right">${(d.expiration_date || '—').split('T')[0]}</dd></div>
                    </dl>
                    ${safetyChips ? `<div class="flex flex-wrap gap-1 mt-3">${safetyChips}</div>` : ''}
                    ${recallDetail}
                    <div class="text-xs text-slate-400 mt-auto pt-3">
                        <a class="text-blue-600 hover:underline" href="${d.fhir_url}" target="_blank">FHIR Device/${d.id}</a>
                        · ${(d.last_updated || '').split('T')[0]}
                    </div>
                </div>
            </div>`;
        }

        async function load() {
            try {
                const res = await fetch(`/patient/${patientId}/devices`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                if (data.patient) renderPatient(data.patient);
                renderBanner(data.recalls);
                const devices = data.devices || [];
                document.getElementById('device-count').textContent =
                    `${devices.length} device${devices.length === 1 ? '' : 's'} on chart`;
                if (!devices.length) {
                    grid.className = '';
                    grid.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center text-slate-500">
                        No devices documented yet.
                        <div class="mt-3"><a class="text-blue-600 underline" href="/scan-to-chart">Document one now →</a></div>
                    </div>`;
                    return;
                }
                grid.className = 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4';
                grid.innerHTML = devices.map(deviceCard).join('');
            } catch (e) {
                grid.className = '';
                grid.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-2xl p-4 text-red-700">
                    Could not load chart: ${e.message}</div>`;
            }
        }
        load();
    </script>
</body>
</html>
