<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeriopUDI — Patient Device Chart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --surface-warm: #F1F4F7; --surface-cool: #E9EDF2;
    --ink: #1B2230; --ink-2: #3A4150; --ink-3: #59616F; --ink-4: #8A93A2;
    --rule: #E2E6EC; --rule-soft: #EDF0F4;
    --primary: #6B3D5C; --primary-soft: #EFE6EC; --primary-deep: #4A2A40;
    --coral: #D86A4A; --coral-soft: #FAE0D5; --coral-deep: #8E3D24;
    --honey: #D4A04B; --honey-soft: #F7EAD0; --honey-deep: #8A6324;
    --slate: #6E7D9C; --slate-soft: #DEE3EE; --slate-deep: #45527A;
    --emerald-soft: #E2EFE9; --emerald-deep: #2E6A55;
    --sky-soft: #DCEEF4; --sky-deep: #245C73;
    --shadow-1: 0 1px 2px rgba(20,28,45,0.05), 0 2px 4px rgba(20,28,45,0.04);
    --shadow-2: 0 4px 12px rgba(20,28,45,0.07), 0 2px 4px rgba(20,28,45,0.05);
    --shadow-3: 0 12px 32px rgba(20,28,45,0.10), 0 4px 12px rgba(20,28,45,0.07);
  }
  html, body { background: var(--bg); color: var(--ink); font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .font-mono { font-family: 'DM Mono', monospace; }
  .surface { background: var(--surface); border-radius: 18px; border: 1px solid var(--rule); }
  .surface-raised { background: var(--surface); border-radius: 20px; border: 1px solid var(--rule); }
  /* Clean outlined device card — hairline border, no resting shadow */
  .card { background: var(--surface); border: 1px solid var(--rule); border-radius: 16px; transition: border-color 0.18s, transform 0.18s; }
  .card:hover { border-color: var(--ink-4); transform: translateY(-1px); }
  .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .btn-open {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: white; background: var(--primary); transition: all 0.15s;
  }
  .btn-open:hover { background: var(--primary-deep); transform: translateY(-1px); }
  .btn-edit {
    display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--surface);
    border: 1px solid var(--rule); cursor: pointer; transition: all 0.15s;
  }
  .del-x {
    position: absolute; top: 10px; right: 10px;
    width: 24px; height: 24px; border-radius: 999px;
    background: var(--coral); color: #fff; font-size: 17px; line-height: 1;
    display: none; align-items: center; justify-content: center;
    border: none; cursor: pointer; z-index: 5; box-shadow: var(--shadow-1);
  }
  .del-x:hover { background: var(--coral-deep); }
  #grid.editing .del-x { display: flex; }
  .card { transition: opacity 0.2s, border-color 0.18s, transform 0.18s; }
</style>
</head>
<body class="min-h-screen">

  <!-- App bar -->
  <header class="sticky top-0 z-30" style="background: rgba(246,247,249,0.85); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule-soft);">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl flex items-center justify-center" style="background: var(--primary);">
          <div class="grid grid-cols-2 gap-0.5">
            <div class="w-1.5 h-1.5 rounded-sm bg-white opacity-90"></div>
            <div class="w-1.5 h-1.5 rounded-sm" style="background: #E89B95;"></div>
            <div class="w-1.5 h-1.5 rounded-sm" style="background: #E89B95;"></div>
            <div class="w-1.5 h-1.5 rounded-sm bg-white opacity-90"></div>
          </div>
        </div>
        <div>
          <div class="font-semibold text-[15px]" style="color: var(--ink);">PeriopUDI</div>
          <div class="text-[11px]" style="color: var(--ink-3);">Patient device chart</div>
        </div>
      </a>
      <a href="/patients" class="text-[13px] font-semibold" style="color: var(--ink-3);">← All patients</a>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- Patient header -->
    <div class="surface-raised p-6 mb-5">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 rounded-full flex items-center justify-center text-white shrink-0" style="background: linear-gradient(135deg, var(--primary), var(--primary-deep));">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-9 h-9">
              <path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.69-8 6v2h16v-2c0-3.31-3.58-6-8-6Z"/>
            </svg>
          </div>
          <div>
            <p class="text-[11px] font-mono uppercase tracking-wider" style="color: var(--ink-4);">Perioperative Device Chart</p>
            <h1 id="patient-name" class="text-[26px] font-semibold tracking-tight mt-0.5" style="color: var(--ink);">Loading…</h1>
            <div id="patient-meta" class="flex flex-wrap gap-2 mt-2"></div>
          </div>
        </div>
        <div class="text-right">
          <div class="flex items-center gap-2 justify-end">
            <button id="edit-btn" class="btn-edit">Edit</button>
            <a href="/scan-to-chart?patient_id={{ patient_id }}" class="btn-open">+ Document device</a>
          </div>
          <p id="device-count" class="text-[12px] mt-2" style="color: var(--ink-4);"></p>
        </div>
      </div>
    </div>

    <!-- Recall banner -->
    <div id="recall-banner" class="hidden mb-5"></div>

    <!-- Device grid -->
    <div id="grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <p class="text-[14px]" style="color: var(--ink-4);">Loading devices…</p>
    </div>
  </main>

  <!-- Full-page perioperative protocol view -->
  <div id="protocol-overlay" class="hidden fixed inset-0 z-50 overflow-y-auto" style="background: var(--bg);">
    <header class="sticky top-0 z-10" style="background: rgba(246,247,249,0.92); backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule-soft);">
      <div class="w-full px-6 sm:px-10 py-4 flex items-center justify-between gap-4">
        <div class="min-w-0">
          <p class="text-[11px] font-mono uppercase tracking-wider" style="color: var(--ink-4);">Perioperative protocol</p>
          <h2 id="protocol-overlay-title" class="text-[20px] font-semibold tracking-tight truncate" style="color: var(--ink);"></h2>
        </div>
        <div class="flex items-center gap-5 shrink-0">
          <div id="overlay-tabs" class="hidden items-center gap-5">
            <button data-tab="protocol" class="ov-tab pb-1 text-[13px] font-semibold transition">Protocol</button>
            <button data-tab="visual" class="ov-tab pb-1 text-[13px] font-semibold transition">Visual</button>
          </div>
          <button id="protocol-overlay-close" title="Back to all devices (Esc)"
                  class="w-10 h-10 rounded-full flex items-center justify-center text-[20px] leading-none transition"
                  style="background: var(--surface); border: 1px solid var(--rule); color: var(--ink-2);"
                  onmouseover="this.style.borderColor='var(--ink-4)'" onmouseout="this.style.borderColor='var(--rule)'">
            &times;
          </button>
        </div>
      </div>
    </header>
    <div class="w-full px-6 sm:px-10 py-8">
      <div id="protocol-overlay-body" class="surface p-6 sm:p-10"></div>
      <div id="visual-overlay-body" class="surface p-6 sm:p-10 hidden"></div>
    </div>
  </div>

  <script src="/static/protocol_card.js"></script>
  <script>
    const esc = s => (s == null ? '' : String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])));
    const patientId = {{ patient_id | tojson }};
    const grid = document.getElementById('grid');
    const bannerEl = document.getElementById('recall-banner');

    const chip = (t, bg, fg) => `<span class="chip" style="background:${bg};color:${fg};">${esc(t)}</span>`;
    const metaChip = (label, val) => `<span class="chip" style="background:var(--surface-cool);color:var(--ink-2);">
        <span style="color:var(--ink-4);font-weight:500;">${label}</span> ${esc(val)}</span>`;

    // Category color coordination (distinct but harmonized with the cool theme)
    const CATEGORY = {
      cardiac:    { bar: '#C2536A', bg: '#F7E4E8', fg: '#9B2F47', label: 'Cardiac' },
      diabetes:   { bar: '#6B8C3A', bg: '#E6F0DC', fg: '#4A6B24', label: 'Diabetes' },
      neuro:      { bar: '#7C5BC2', bg: '#ECE6F7', fg: '#553B91', label: 'Neuro' },
      ortho:      { bar: '#C98A3A', bg: '#F7EAD0', fg: '#8A6324', label: 'Orthopedic' },
      vascular:   { bar: '#2E8B82', bg: '#DCEFEC', fg: '#1F6157', label: 'Vascular' },
      ophthalmic: { bar: '#3A8FB0', bg: '#DCEEF4', fg: '#245C73', label: 'Ophthalmic' },
      general:    { bar: '#6E7D9C', bg: '#DEE3EE', fg: '#45527A', label: 'General' },
    };
    const SAFETY = {
      'mri':               { bg: 'var(--slate-soft)',   fg: 'var(--slate-deep)' },
      'mri-institutional': { bg: 'var(--honey-soft)',   fg: 'var(--honey-deep)' },
      'latex':             { bg: 'var(--coral-soft)',   fg: 'var(--coral-deep)' },
      'no-latex':          { bg: 'var(--emerald-soft)', fg: 'var(--emerald-deep)' },
      'single-use':        { bg: 'var(--surface-cool)', fg: 'var(--ink-3)' },
      'sterile':           { bg: 'var(--sky-soft)',     fg: 'var(--sky-deep)' },
    };

    function renderPatient(p) {
      document.getElementById('patient-name').textContent = p.name || ('Patient ' + p.id);
      const meta = document.getElementById('patient-meta');
      const mrn = p.mrn ? (String(p.mrn).length > 12 ? String(p.mrn).slice(0, 8) + '…' : p.mrn) : null;
      const bits = [metaChip('ID', p.id)];
      if (mrn) bits.push(metaChip('MRN', mrn));
      if (p.gender) bits.push(metaChip('Sex', p.gender));
      if (p.age != null) bits.push(metaChip('Age', p.age));
      if (p.birth_date) bits.push(metaChip('DOB', p.birth_date));
      meta.innerHTML = bits.join('');
    }

    function renderBanner(recalls) {
      if (!recalls || !recalls.length) { bannerEl.classList.add('hidden'); return; }
      const critical = recalls.some(c => c.indicator === 'critical');
      const bg = critical ? 'var(--coral-soft)' : 'var(--honey-soft)';
      const fg = critical ? 'var(--coral-deep)' : 'var(--honey-deep)';
      bannerEl.className = 'mb-5 rounded-2xl p-4';
      bannerEl.style = `background:${bg};border:1px solid ${fg}33;`;
      bannerEl.innerHTML = `
        <div class="flex items-start gap-3">
          <span class="text-2xl">${critical ? '⛔' : '⚠️'}</span>
          <div>
            <h2 class="font-bold" style="color:${fg};">${recalls.length} device recall alert${recalls.length > 1 ? 's' : ''} for this patient</h2>
            <ul class="text-[13px] mt-1 ml-4 list-disc" style="color:${fg};">
              ${recalls.map(c => `<li>${esc(c.summary)}</li>`).join('')}
            </ul>
          </div>
        </div>`;
      bannerEl.classList.remove('hidden');
    }

    function field(label, val, mono) {
      return `<div class="flex justify-between gap-2 py-0.5">
        <dt style="color:var(--ink-4);">${label}</dt>
        <dd class="text-right ${mono ? 'font-mono text-[12px]' : ''}" style="color:var(--ink-2);">${val ? esc(val) : '—'}</dd></div>`;
    }

    function deviceCard(d) {
      const cat = CATEGORY[d.category] || CATEGORY.general;
      const recalled = d.recall_flag;
      const critical = recalled && d.recall && d.recall.indicator === 'critical';
      const border = recalled ? `border-color:${critical ? 'var(--coral)' : 'var(--honey)'};` : '';
      const recallBadge = recalled
        ? chip(`RECALL · ${(d.recall && d.recall.classification) || ''}`,
               critical ? 'var(--coral)' : 'var(--honey)', '#fff') : '';
      const recallDetail = recalled && d.recall ? `
        <div class="mt-3 text-[13px] rounded-xl p-2.5" style="background:${critical ? 'var(--coral-soft)' : 'var(--honey-soft)'};color:${critical ? 'var(--coral-deep)' : 'var(--honey-deep)'};">
          <span class="font-semibold">FDA recall ${esc(d.recall.recall_number || '')}:</span> ${esc(d.recall.reason || '')}
        </div>` : '';
      const gmdn = d.type ? `${esc(d.type)}${d.gmdn_code ? ` <span style="color:var(--ink-4)">(GMDN ${esc(d.gmdn_code)})</span>` : ''}` : '—';
      const safety = (d.safety || []).filter(s => s.display).map(s => {
        const st = SAFETY[s.code] || { bg: 'var(--surface-cool)', fg: 'var(--ink-3)' };
        return chip(s.display.replace('MRI: ', ''), st.bg, st.fg);
      }).join(' ');
      return `
      <div class="card flex flex-col relative"
           style="${border}"
           data-fhir-id="${esc(d.id)}"
           data-di="${esc(d.device_identifier || '')}"
           data-mfr="${esc(d.manufacturer || '')}"
           data-brand="${esc(d.name || '')}"
           data-class-key="${esc(d.protocol_class || '')}">
        <button class="del-x" title="Delete device" onclick="deleteDevice('${esc(d.id)}', this)">&times;</button>
        <div class="p-4 flex flex-col h-full">
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-semibold text-[15px] leading-snug" style="color:var(--ink);">${esc(d.name)}</h3>
            ${d.us_core ? chip('US Core', 'var(--primary-soft)', 'var(--primary-deep)') : chip('EHR', 'var(--surface-cool)', 'var(--ink-3)')}
          </div>
          <div class="flex flex-wrap gap-1 mt-2">
            ${chip(cat.label, cat.bg, cat.fg)}
            ${recallBadge}
            ${chip(d.status || 'unknown', 'var(--surface-cool)', 'var(--ink-3)')}
          </div>
          <p class="text-[13px] mt-3" style="color:var(--ink-3);">${gmdn}</p>
          <dl class="text-[13px] mt-2">
            ${field('Manufacturer', d.manufacturer)}
            ${field('Model', d.model)}
            ${field('UDI-DI', d.device_identifier, true)}
            ${field('Expires', (d.expiration_date || '').split('T')[0])}
          </dl>
          ${safety ? `<div class="flex flex-wrap gap-1 mt-3">${safety}</div>` : ''}
          ${recallDetail}
          ${d.protocol_available ? `
          <button class="chip mt-3 self-start cursor-pointer"
                  style="background:var(--primary-soft);color:var(--primary-deep);border:1px solid var(--primary);"
                  onclick="openProtocol('${esc(d.id)}')">
            Periop protocol →
          </button>` : ''}
          <div id="qf-${esc(d.id)}" class="qf-stub"></div>
          <div class="text-[11px] mt-auto pt-3" style="color:var(--ink-4);">
            <a class="hover:underline" style="color:var(--primary);" href="${esc(d.fhir_url)}" target="_blank">FHIR Device/${esc(d.id)}</a>
            · ${esc((d.last_updated || '').split('T')[0])}
          </div>
        </div>
      </div>`;
    }

    // ---- Full-page protocol view (Protocol | Visual tabs) ----
    const protocolOverlay = document.getElementById('protocol-overlay');
    const protocolBody = document.getElementById('protocol-overlay-body');
    const visualBody = document.getElementById('visual-overlay-body');
    const protocolTitle = document.getElementById('protocol-overlay-title');
    const overlayTabs = document.getElementById('overlay-tabs');

    const devicesById = {};            // populated by load()
    let currentEntry = null;           // device entry for the open overlay
    let currentProtocol = null;        // protocol block for the open overlay
    let currentProtocolPromise = null; // resolves to the protocol block (or null)
    let visualHandle = null;           // {dispose} from initHeartVisual
    let visualLoaded = false;          // scripts injected once per page

    function setTab(tab) {
      protocolBody.classList.toggle('hidden', tab !== 'protocol');
      visualBody.classList.toggle('hidden', tab !== 'visual');
      overlayTabs.querySelectorAll('.ov-tab').forEach(b => {
        const active = b.dataset.tab === tab;
        b.style.color = active ? 'var(--ink)' : 'var(--ink-4)';
        b.style.borderBottom = `2px solid ${active ? 'var(--primary)' : 'transparent'}`;
      });
      if (tab === 'visual') activateVisual();
    }

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = () => reject(new Error('failed to load ' + src));
        document.head.appendChild(s);
      });
    }

    async function activateVisual() {
      if (!currentEntry || visualHandle) return;
      const entry = currentEntry;
      visualBody.innerHTML = `<p class="text-[14px]" style="color:var(--ink-4);">Loading 3D view…</p>`;
      try {
        const protocol = currentProtocol ||
          (currentProtocolPromise ? await currentProtocolPromise : null);
        if (entry !== currentEntry || visualHandle) return; // overlay changed meanwhile
        if (!visualLoaded) {
          await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');
          await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');
          await loadScript('/static/heart_visual.js');
          visualLoaded = true;
        }
        if (entry !== currentEntry || visualHandle) return;
        visualBody.innerHTML = '';
        visualHandle = initHeartVisual(visualBody, {
          protocol: protocol,
          implant: entry.implant,
          deviceName: entry.name,
          manufacturer: entry.manufacturer,
          fhirId: entry.id,
          onLocationSaved: (implant) => { entry.implant = implant; },
        });
      } catch (e) {
        visualBody.innerHTML = `<p class="text-[14px]" style="color:var(--coral-deep);">Could not load 3D view: ${esc(e.message)}</p>`;
      }
    }

    async function openProtocol(deviceId) {
      const entry = devicesById[deviceId];
      if (!entry) return;
      currentEntry = entry;
      currentProtocol = null;
      protocolTitle.textContent = entry.name || 'Device protocol';
      protocolBody.innerHTML = `<p class="text-[14px]" style="color:var(--ink-4);">Loading protocol…</p>`;
      const showVisualTab = entry.protocol_module === 'cardiac_rhythm';
      overlayTabs.classList.toggle('hidden', !showVisualTab);
      overlayTabs.classList.toggle('flex', showVisualTab);
      setTab('protocol');
      protocolOverlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
      currentProtocolPromise = (async () => {
        try {
          const res = await fetch(`/api/protocol/by-di/${encodeURIComponent(entry.device_identifier)}?context=surgery`);
          const data = await res.json();
          if (data.found && data.protocol) {
            currentProtocol = data.protocol;
            if (currentEntry === entry) {
              renderProtocolPanel(protocolBody, data.protocol, entry.device_identifier);
            }
            return data.protocol;
          }
          protocolBody.innerHTML = `<p class="text-[14px]" style="color:var(--ink-4);">No protocol available for this device${data.error ? ': ' + esc(data.error) : ' (GUDID record not reachable)'}.</p>`;
        } catch (e) {
          protocolBody.innerHTML = `<p class="text-[14px]" style="color:var(--coral-deep);">Could not load protocol: ${esc(e.message)}</p>`;
        }
        return null;
      })();
      await currentProtocolPromise;
    }

    function closeProtocol() {
      if (visualHandle) { visualHandle.dispose(); visualHandle = null; }
      protocolOverlay.classList.add('hidden');
      protocolBody.innerHTML = '';
      visualBody.innerHTML = '';
      currentEntry = null;
      currentProtocol = null;
      currentProtocolPromise = null;
      document.body.style.overflow = '';
    }

    overlayTabs.querySelectorAll('.ov-tab').forEach(b =>
      b.addEventListener('click', () => setTab(b.dataset.tab)));
    document.getElementById('protocol-overlay-close').addEventListener('click', closeProtocol);
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !protocolOverlay.classList.contains('hidden')) closeProtocol();
    });

    async function load() {
      try {
        const res = await fetch(`/patient/${patientId}/devices`);
        const data = await res.json();
        if (data.error) throw new Error(data.error);
        if (data.patient) renderPatient(data.patient);
        renderBanner(data.recalls);
        const devices = data.devices || [];
        document.getElementById('device-count').textContent =
          `${devices.length} device${devices.length === 1 ? '' : 's'} on chart`;
        if (!devices.length) {
          grid.className = '';
          grid.innerHTML = `<div class="surface p-8 text-center text-[14px]" style="color:var(--ink-4);">
            No devices documented yet.
            <div class="mt-3"><a style="color:var(--primary);font-weight:600;" href="/scan-to-chart?patient_id=${encodeURIComponent(patientId)}">Document one now →</a></div>
          </div>`;
          return;
        }
        grid.className = 'grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4';
        devices.forEach(d => { devicesById[d.id] = d; });
        grid.innerHTML = devices.map(deviceCard).join('');
        loadQuickFacts();
      } catch (e) {
        grid.className = '';
        grid.innerHTML = `<div class="rounded-2xl p-4" style="background:var(--coral-soft);color:var(--coral-deep);">Could not load chart: ${esc(e.message)}</div>`;
      }
    }
    load();

    // ---- Quick-facts strip ----
    function renderQuickFacts(fhirId, qf, cardEl) {
      const stub = document.getElementById('qf-' + fhirId);
      if (!stub) return;
      const lines = [];

      // Headline (most critical — top of strip)
      if (qf.headline) {
        const sev = qf.headline_severity || 'caution';
        const barColor = sev === 'critical' ? 'var(--coral)' : 'var(--honey)';
        const bg       = sev === 'critical' ? 'var(--coral-soft)' : 'var(--honey-soft)';
        const fg       = sev === 'critical' ? 'var(--coral-deep)' : 'var(--honey-deep)';
        lines.push(`<div class="mt-3 rounded-xl px-3 py-2 text-[12px] leading-snug"
            style="border-left:3px solid ${barColor};background:${bg};color:${fg};">
          ${esc(qf.headline)}
        </div>`);
      }

      // Sub-class badge + VERIFY chip
      const chips = [];
      if (qf.subclass) chips.push(`<span class="chip" style="background:var(--slate-soft);color:var(--slate-deep);">${esc(qf.subclass)}</span>`);
      if (qf.verify_required) chips.push(`<span class="chip" style="background:var(--coral-soft);color:var(--coral-deep);">⚠ VERIFY</span>`);
      if (chips.length) lines.push(`<div class="flex flex-wrap gap-1 mt-2">${chips.join('')}</div>`);

      // Brand facts (magnet / cautery / MRI)
      if (qf.has_brand_facts) {
        const facts = [];
        if (qf.magnet) facts.push(`<div class="flex gap-2 items-start py-1" style="border-top:1px solid var(--rule-soft);">
            <span class="shrink-0 text-[11px] pt-0.5" style="color:var(--ink-4);">Magnet</span>
            <span class="text-[12px] font-medium" style="color:var(--ink-2);">${esc(qf.magnet)}</span></div>`);
        if (qf.electrocautery) facts.push(`<div class="flex gap-2 items-start py-1" style="border-top:1px solid var(--rule-soft);">
            <span class="shrink-0 text-[11px] pt-0.5" style="color:var(--ink-4);">Cautery</span>
            <span class="text-[12px] font-medium" style="color:var(--ink-2);">${esc(qf.electrocautery)}</span></div>`);
        if (qf.mri) facts.push(`<div class="flex gap-2 items-start py-1" style="border-top:1px solid var(--rule-soft);">
            <span class="shrink-0 text-[11px] pt-0.5" style="color:var(--ink-4);">MRI</span>
            <span class="text-[12px] font-medium" style="color:var(--ink-2);">${esc(qf.mri)}</span></div>`);
        if (facts.length) lines.push(`<div class="mt-2 text-[12px]">${facts.join('')}</div>`);

        if (qf.support_phone) {
          const phone = String(qf.support_phone).replace(/[^+\d]/g, '');
          lines.push(`<a href="tel:${esc(phone)}" class="block mt-2 text-[12px] font-semibold hover:underline" style="color:var(--primary);">📞 ${esc(qf.support_phone)}</a>`);
        }
      } else {
        // No brand facts yet — show PDF URL form (unless extraction is running)
        const status = qf.ifu_status;
        if (status === 'pending') {
          lines.push(ifuPendingHTML());
        } else {
          lines.push(ifuFormHTML(fhirId, cardEl));
        }
      }

      // Pacer note
      if (qf.pacer_note) lines.push(`<p class="mt-2 text-[11px] leading-snug" style="color:var(--ink-4);">${esc(qf.pacer_note)}</p>`);

      stub.innerHTML = lines.join('');

      // Wire up the form if it was injected
      const form = stub.querySelector('.ifu-url-form');
      if (form) wireIfuForm(form, fhirId, cardEl);
    }

    function ifuPendingHTML() {
      return `<div class="mt-3 flex items-center gap-2 text-[12px]" style="color:var(--ink-4);">
        <svg class="animate-spin w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path>
        </svg>
        Extracting device facts from PDF…
      </div>`;
    }

    function ifuFormHTML(fhirId, cardEl) {
      return `
        <div class="ifu-url-form mt-3 pt-3" style="border-top:1px solid var(--rule-soft);">
          <p class="ifu-url-label text-[11px] font-semibold mb-1.5" style="color:var(--ink-4);">No device facts — paste manufacturer PDF URL:</p>
          <div class="flex gap-1.5">
            <input type="url" placeholder="https://…/manual.pdf"
              class="ifu-url-input flex-1 text-[12px] px-2.5 py-1.5 rounded-lg outline-none"
              style="border:1px solid var(--rule);background:var(--surface-warm);color:var(--ink);min-width:0;"
              onfocus="this.style.borderColor='var(--primary)'" onblur="this.style.borderColor='var(--rule)'">
            <button class="ifu-url-btn shrink-0 text-[12px] font-semibold px-3 py-1.5 rounded-lg text-white transition"
              style="background:var(--primary);">Run</button>
          </div>
          <p class="ifu-url-msg text-[11px] mt-1" style="color:var(--ink-4);min-height:1em;"></p>
        </div>`;
    }

    // Pre-fill the PDF box from the offline manual library (data/manuals/) so the
    // clinician doesn't have to go hunting for a manufacturer manual mid-case.
    async function prefillFromLibrary(form, cardEl) {
      const mfr   = cardEl.dataset.mfr   || '';
      const brand = cardEl.dataset.brand || '';
      if (!mfr && !brand) return;
      try {
        const q = new URLSearchParams({ manufacturer: mfr, brand: brand });
        const res = await fetch('/api/ifu/suggest?' + q);
        const d = await res.json();
        if (!d.found) return;
        const input = form.querySelector('.ifu-url-input');
        const label = form.querySelector('.ifu-url-label');
        const msg   = form.querySelector('.ifu-url-msg');
        if (input && !input.value) input.value = d.url;
        if (label) label.textContent = 'Manual found in library — press Run to extract:';
        if (msg) {
          msg.textContent = '';
          const a = document.createElement('a');
          a.href = d.url; a.target = '_blank';
          a.style.color = 'var(--primary)';
          a.textContent = d.label + (d.pages ? ` (${d.pages} pp)` : '');
          msg.appendChild(a);
        }
      } catch (e) { /* library is an optimisation; the manual box still works */ }
    }

    function wireIfuForm(form, fhirId, cardEl) {
      const input  = form.querySelector('.ifu-url-input');
      const btn    = form.querySelector('.ifu-url-btn');
      const msg    = form.querySelector('.ifu-url-msg');

      prefillFromLibrary(form, cardEl);

      async function submit() {
        const url = (input.value || '').trim();
        if (!url) { msg.textContent = 'Paste a PDF URL first.'; msg.style.color = 'var(--coral-deep)'; return; }
        btn.disabled = true;
        btn.style.opacity = '0.5';
        msg.style.color = 'var(--ink-4)';
        msg.textContent = 'Starting…';
        try {
          const res = await fetch('/api/ifu/extract', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              url,
              manufacturer: cardEl.dataset.mfr  || '',
              brand:        cardEl.dataset.brand || '',
              model:        cardEl.dataset.brand || '',
              di:           cardEl.dataset.di    || '',
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.started) {
            msg.textContent = data.error || 'Failed to start extraction.';
            msg.style.color = 'var(--coral-deep)';
            btn.disabled = false; btn.style.opacity = '1';
            return;
          }
          // Show spinner, then poll
          const stub = document.getElementById('qf-' + fhirId);
          if (stub) stub.innerHTML = ifuPendingHTML();
          pollIfuStatus(fhirId, cardEl, 5000);
        } catch (e) {
          msg.textContent = 'Network error — try again.';
          msg.style.color = 'var(--coral-deep)';
          btn.disabled = false; btn.style.opacity = '1';
        }
      }

      btn.addEventListener('click', submit);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
    }

    function pollIfuStatus(fhirId, cardEl, intervalMs) {
      const mfr   = cardEl.dataset.mfr   || '';
      const brand = cardEl.dataset.brand || '';
      const timer = setInterval(async () => {
        try {
          const res = await fetch(`/api/ifu/status?manufacturer=${encodeURIComponent(mfr)}&brand=${encodeURIComponent(brand)}`);
          const data = await res.json();
          const done = ['extracted', 'verified', 'conflict', 'no_facts'];
          if (data.found && done.includes(data.status)) {
            clearInterval(timer);
            // Re-fetch quick-facts and re-render the strip
            const params = new URLSearchParams({ manufacturer: mfr, brand, class_key: cardEl.dataset.classKey || '' });
            const qfRes = await fetch('/api/quick-facts?' + params);
            if (qfRes.ok) {
              const qf = await qfRes.json();
              renderQuickFacts(fhirId, qf, cardEl);
            }
          }
        } catch (_) { /* keep polling */ }
      }, intervalMs);
      // Safety: stop polling after 5 minutes
      setTimeout(() => clearInterval(timer), 5 * 60 * 1000);
    }

    async function loadQuickFacts() {
      const cards = document.querySelectorAll('[data-class-key]');
      await Promise.all(Array.from(cards).map(async card => {
        const classKey = card.dataset.classKey;
        const mfr      = card.dataset.mfr;
        const brand    = card.dataset.brand;
        const fhirId   = card.dataset.fhirId;
        if (!classKey && !mfr) return;
        try {
          const params = new URLSearchParams({ manufacturer: mfr || '', brand: brand || '', class_key: classKey || '' });
          const res = await fetch('/api/quick-facts?' + params);
          if (!res.ok) return;
          const qf = await res.json();
          if (Object.keys(qf).length) renderQuickFacts(fhirId, qf, card);
        } catch (_) { /* non-critical */ }
      }));
    }

    // ---- Edit / delete ----
    const editBtn = document.getElementById('edit-btn');
    let editing = false;
    editBtn.addEventListener('click', () => {
      editing = !editing;
      grid.classList.toggle('editing', editing);
      editBtn.textContent = editing ? 'Done' : 'Edit';
      editBtn.style.color = editing ? 'var(--coral-deep)' : 'var(--ink-2)';
    });

    async function deleteDevice(id, btn) {
      if (window.event) { window.event.preventDefault(); window.event.stopPropagation(); }
      if (!confirm('Delete this device from the chart?')) return;
      try {
        const res = await fetch('/api/device/' + id, { method: 'DELETE' });
        const data = await res.json();
        if (!data.success) throw new Error('server refused');
        const card = btn.closest('.card');
        if (card) { card.style.opacity = '0'; setTimeout(() => card.remove(), 200); }
      } catch (e) {
        alert('Could not delete device: ' + e.message);
      }
    }
  </script>
</body>
</html>
