<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeriopUDI — Patient Device Timeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <div class="max-w-3xl mx-auto p-6">
        <header class="mb-6 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Device Timeline</h1>
                <p class="text-slate-500">Patient <span class="font-mono">{{ patient_id }}</span></p>
            </div>
            <a href="/scan-to-chart" class="bg-blue-600 text-white px-4 py-2 rounded-lg">+ Document device</a>
        </header>

        <div id="timeline" class="space-y-3">
            <p class="text-slate-400">Loading…</p>
        </div>
    </div>

    <script>
        const patientId = {{ patient_id | tojson }};
        const container = document.getElementById('timeline');

        function badge(text, cls) {
            return `<span class="text-xs px-2 py-0.5 rounded-full ${cls}">${text}</span>`;
        }

        async function load() {
            try {
                const res = await fetch(`/patient/${patientId}/devices`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                const devices = data.devices || [];
                if (!devices.length) {
                    container.innerHTML = `<div class="bg-white rounded-xl shadow p-6 text-center text-slate-500">
                        No devices documented for this patient yet.
                        <div class="mt-3"><a class="text-blue-600 underline" href="/scan-to-chart">Document one now →</a></div>
                    </div>`;
                    return;
                }
                container.innerHTML = devices.map(d => `
                    <div class="bg-white rounded-xl shadow p-4 border-l-4 ${d.us_core ? 'border-blue-500' : 'border-slate-300'}">
                        <div class="flex items-center justify-between">
                            <h3 class="font-semibold text-slate-800">${d.name}</h3>
                            <div class="space-x-1">
                                ${d.us_core ? badge('US Core', 'bg-blue-100 text-blue-700') : ''}
                                ${d.recall_flag ? badge('RECALL', 'bg-red-100 text-red-700') : ''}
                                ${badge(d.status || 'unknown', 'bg-slate-100 text-slate-600')}
                            </div>
                        </div>
                        <dl class="text-sm text-slate-600 mt-2 grid grid-cols-2 gap-x-4 gap-y-1">
                            <div><span class="font-medium">Manufacturer:</span> ${d.manufacturer || '—'}</div>
                            <div><span class="font-medium">Model:</span> ${d.model || '—'}</div>
                            <div><span class="font-medium">UDI-DI:</span> ${d.device_identifier || '—'}</div>
                            <div><span class="font-medium">Expires:</span> ${d.expiration_date || '—'}</div>
                        </dl>
                        <div class="text-xs text-slate-400 mt-2">
                            Documented ${d.last_updated || ''} ·
                            <a class="text-blue-600 underline" href="${d.fhir_url}" target="_blank">FHIR Device/${d.id}</a>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = `<div class="bg-red-50 border border-red-200 rounded-xl p-4 text-red-700">
                    Could not load timeline: ${e.message}</div>`;
            }
        }
        load();
    </script>
</body>
</html>
