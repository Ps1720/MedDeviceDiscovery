spring:
  main:
    allow-circular-references: true
  flyway:
    enabled: false
    baseline-on-migrate: true
    fail-on-missing-locations: false
  datasource:
    url: jdbc:postgresql://hapi-db:5432/hapi
    username: hapi
    password: hapi
    driver-class-name: org.postgresql.Driver
    max-active: 15
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      hibernate.search.enabled: false

hapi:
  fhir:
    # ---- Core ----
    fhir_version: R4
    server_address: http://localhost:8080/fhir
    default_encoding: json

    # ---- US Core v8.0.1 Implementation Guide ----
    # Installed at startup so Device resources can be validated against the
    # US Core Implantable Device Profile (Build.md Phase 1 / Phase 7).
    implementationguides:
      us_core:
        name: hl7.fhir.us.core
        version: 8.0.1

    # ---- Validation (acceptance: HAPI rejects an invalid Device) ----
    validation:
      requests_enabled: true
      responses_enabled: false

    # ---- CORS ----
    # HAPI is not published to the host (see docker-compose.yml): only the app,
    # on the internal Docker network, talks to it. Nothing browser-side calls it
    # cross-origin, so no origin needs to be allowed. Set CORS_ALLOWED_ORIGIN to
    # your app's public origin only if you deliberately expose HAPI.
    cors:
      allow_Credentials: false
      allowed_origin:
        - ${CORS_ALLOWED_ORIGIN:http://localhost:8090}

    # ---- Capabilities ----
    # allow_multiple_delete stays OFF: it permits conditional mass deletion
    # (DELETE /Patient?_lastUpdated=gt2000 wipes every match in one request),
    # which is not something a demo deployment should be able to do by accident
    # or otherwise.
    allow_multiple_delete: false
    allow_external_references: true
    reuse_cached_search_results_millis: 60000

    # ---- Browsable web UI (HAPI Tester overlay) ----
    # Deliberately omitted. The overlay is an unauthenticated admin console over
    # the whole data set; HAPI only mounts it when a `tester:` map is present, so
    # leaving the key out disables it. (Setting it to null does NOT work — Spring
    # fails to bind null to the expected Map and the server refuses to start.)
